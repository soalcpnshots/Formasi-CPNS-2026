.nav{max-width:1100px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.35rem;letter-spacing:-.4px}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--g);display:grid;place-items:center}
.nav nav{display:flex;gap:22px;flex-wrap:wrap}
.nav a.l{color:var(--tx);text-decoration:none;font-size:.95rem;padding:10px 2px;opacity:.85}.nav a.l:hover{opacity:1;color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:8px 20px 56px}
h1,h2,h3{font-weight:700;letter-spacing:-.02em}
.hero{position:relative;overflow:hidden;background:var(--g);color:#fff;border-radius:36px;padding:56px 48px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
:is(.hero,.promo) .bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
:is(.hero,.promo) .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:grayscale(.55) contrast(1.05);animation:bgfade 24s ease-in-out infinite;will-change:opacity,transform}
:is(.hero,.promo) .bg img:nth-child(2){animation-delay:12s}
:is(.hero,.promo) .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,63,75,.6),rgba(4,63,75,.1) 85%)}
@keyframes bgfade{0%{opacity:0;transform:scale(1.03)}8%{opacity:.3}50%{opacity:.3}58%{opacity:0;transform:scale(1.15) translate(-1.5%,-1%)}100%{opacity:0;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){:is(.hero,.promo) .bg img{animation:none}:is(.hero,.promo) .bg img:first-child{opacity:.25}}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .tx{flex:1 1 360px;position:relative;z-index:1}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.08;margin:0 0 16px}
.hero p{margin:0 0 28px;font-size:1.1rem;max-width:470px;opacity:.93}
.btn{display:inline-block;border:0;background:var(--ac);color:var(--ac-tx);padding:10px 22px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.hero .btn{background:var(--sun);color:var(--deep);padding:14px 30px;font-size:1.05rem;font-weight:700}
.hero .vis{flex:1 1 300px;max-width:400px;width:100%;position:relative;z-index:1;margin:0 auto}
.hero .vis svg{width:100%;height:auto;display:block}
.badge{position:absolute;left:0;bottom:14px;background:#fff;color:#0e2a30;border-radius:16px;padding:10px 16px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.badge b{display:block;font-size:1.3rem;line-height:1.1;color:#087a8c}.badge small{color:#55727a}
.sec{padding-top:84px}
.sec>h2,.sec h2.t{font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 22px}
.split{display:flex;flex-wrap:wrap;gap:44px;align-items:center}
.pnl{flex:1 1 340px;display:flex;justify-content:center}
.pnl .in{background:var(--soft);border-radius:36px;padding:28px;width:100%;max-width:440px}
.pnl svg{width:100%;height:auto;display:block}
.fl{flex:1 1 380px;display:grid;gap:12px}
.fc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh)}
.ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--g);display:flex;align-items:center;justify-content:center}
.fc b{display:block}.fc span{font-size:.9rem;color:var(--mu)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
input,textarea,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;width:100%}
.bar input{flex:1 1 220px;box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:0;background:var(--chip);color:var(--tx);padding:7px 16px;border-radius:99px;cursor:pointer;font:inherit;font-size:.9rem}
.chip.on{background:var(--ac);color:var(--ac-tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;margin-bottom:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.fic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--chip);color:var(--ac);display:grid;place-items:center}
.card .info{flex:1 1 220px;min-width:0}
.card h3{margin:0 0 2px;font-size:1.05rem;overflow-wrap:anywhere}
.card p{margin:0;color:var(--mu);font-size:.92rem;overflow-wrap:anywhere}
.meta{font-size:.8rem;color:var(--mu);margin-top:4px}
.btn.sec{background:var(--chip);color:var(--tx);font-weight:500}
.btn.del{background:transparent;color:var(--dg);font-weight:500;padding:9px 10px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--mu);padding:40px 10px;border:1px dashed var(--bd);border-radius:18px}
.admin{margin-top:48px;padding:22px;border:1px solid var(--bd);border-radius:20px;background:var(--card)}
.admin h2{margin:0 0 14px;font-size:1.1rem}
.admin label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.note{font-size:.85rem;color:var(--mu);margin-top:10px}.err{color:var(--dg)}
footer{margin-top:40px;font-size:.85rem;color:var(--mu);text-align:center}
.promo{position:relative;overflow:hidden;background:var(--g);color:#fff;border-radius:36px;padding:44px 36px}
.promo>*{position:relative;z-index:1}.promo>.bg{position:absolute;z-index:0}
.promo .tag{display:inline-block;background:var(--sun);color:var(--deep);font-weight:700;font-size:.85rem;padding:5px 14px;border-radius:99px}
.promo h2{margin:14px 0 4px;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.2}
.promo .sub{color:#fff;opacity:.92;margin:0 0 14px}
.promo .price{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.promo .price s{opacity:.7}.promo .price strong{font-size:2.8rem;line-height:1;color:var(--sun)}
.promo ul{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px}
.promo li::before{content:"✓";color:var(--sun);font-weight:700;margin-right:8px}
.promo .lead{margin:0 0 10px}
.promo-btn{display:block;text-align:center;background:var(--sun);color:var(--deep);font-size:1.1rem;padding:15px 18px;border-radius:99px;font-weight:700;text-decoration:none}
.promo-btn:hover{filter:brightness(1.06)}
.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:24px 0 4px}
.gallery img{height:300px;width:auto;border-radius:16px;scroll-snap-align:start;cursor:zoom-in;background:#fff;flex:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
.steps{background:var(--card);border:1px solid var(--bd);border-radius:36px;padding:48px 28px;text-align:center;box-shadow:var(--sh)}

.st{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.st>div{flex:1 1 220px;max-width:300px;background:var(--soft);border-radius:26px;padding:20px 18px 22px}

.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--ac-tx);font-weight:700;margin-bottom:6px}
.lab{font-weight:600}
.tlh{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:26px}.tlh>div{flex:1 1 300px}.tlh svg{width:150px;height:auto;flex:none}.tlh h2{margin:0 0 6px;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2}.tlh .sub{margin:0}

.tl .tg{display:inline-block;background:var(--sun);color:var(--deep);font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:8px}.tlnote{font-size:.85rem;color:var(--mu);margin:4px 0 0}

<script>
(function(){
  var state;
  try { state = JSON.parse(document.getElementById('data').textContent); } catch(e) { state = {title:'Pusat Unduhan',description:'',links:[]}; }
  state.links = state.links || [];
  var artifact = null, canEdit = false, q = '', cat = 'Semua', editId = null, msg = '', busy = false;
  var app = document.getElementById('app');

  function h(tag, props) {
    var el = document.createElement(tag);
    for (var k in (props || {})) {
      if (k === 'class') el.className = props[k];
      else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), props[k]);
      else el.setAttribute(k, props[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }
  function fmt(d) {
    try { return new Date(d).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}); } catch(e) { return d; }
  }
  function cats() {
    var s = {};
    state.links.forEach(function(l){ if (l.cat) s[l.cat] = 1; });
    return ['Semua'].concat(Object.keys(s).sort());
  }

  async function save(note) {
    if (!artifact) return;
    busy = true; msg = '';
    try {
      var clone = document.documentElement.cloneNode(true);
      clone.querySelector('#app').textContent = '';
      clone.querySelector('#data').textContent = JSON.stringify(state).replace(/</g, '\\u003c');
      clone.removeAttribute('data-theme'); clone.removeAttribute('style'); clone.querySelectorAll('style').forEach(function(x){ if (x.textContent.indexOf('artifact-sync') > -1) x.remove(); });
      await artifact.publish('<!doctype html>\n' + clone.outerHTML);
    } catch (e) {
      busy = false;
      msg = 'Gagal menyimpan: ' + ((e && e.message) || 'coba lagi.');
      render();
    }
  }

  function tpl(id) { return document.getElementById(id).content.cloneNode(true); }

  function render() {
    app.textContent = '';
    app.appendChild(h('section', {class:'hero'},
      h('div', {class:'bg', 'aria-hidden':'true'}, tpl('hero-bg-t')),
      h('div', {class:'tx'},
        h('h1', null, state.title),
        state.description ? h('p', null, state.description) : null,
        h('a', {class:'btn', href:'#unduhan'}, 'Lihat file unduhan')),
      h('div', {class:'vis'}, tpl('hero-art-t'), h('div', {class:'badge'}, h('b', null, state.links.length + ' file'), h('small', null, 'siap diunduh gratis')))));


    var sec = h('section', {id:'unduhan', class:'sec'},
      h('h2', {class:'t'}, 'Daftar file unduhan'),
      h('p', {class:'sub'}, 'Cari file yang Anda butuhkan lalu klik File Formasi.'));
    var search = h('input', {type:'search', placeholder:'Cari file…', 'aria-label':'Cari file', value:q});
    search.addEventListener('input', function(){ q = search.value; renderList(); });
    sec.appendChild(h('div', {class:'bar'}, search));
    var chipBox = h('div', {class:'chips'});
    if (cats().length > 2) cats().forEach(function(c){
      chipBox.appendChild(h('button', {class:'chip' + (c === cat ? ' on' : ''), onclick:function(){ cat = c; render(); }}, c));
    });
    if (chipBox.childNodes.length) sec.appendChild(chipBox);
    sec.appendChild(h('div', {id:'list'}));
    app.appendChild(sec);
    renderList();

    app.appendChild(tpl('tl-t'));
    var pn = tpl('promo-t');
    var pr = pn.querySelector('.promo'); pr.insertBefore(h('div', {class:'bg', 'aria-hidden':'true'}, tpl('hero-bg-t')), pr.firstChild);
    pn.querySelector('.gallery').addEventListener('click', function(e){
      if (e.target.tagName !== 'IMG') return;
      var lb = h('div', {class:'lb', onclick:function(){ lb.remove(); }}, h('img', {src:e.target.src, alt:e.target.alt}));
      document.body.appendChild(lb);
    });
    app.appendChild(h('section', {id:'promo', class:'sec'}, pn));
    app.appendChild(tpl('steps-t'));

    if (canEdit) app.appendChild(adminPanel());
    app.appendChild(h('footer', null, state.links.length + ' file tersedia'));
  }

  function renderList() {
    var box = document.getElementById('list');
    box.textContent = '';
    var term = q.trim().toLowerCase();
    var items = state.links.filter(function(l){
      if (cat !== 'Semua' && l.cat !== cat) return false;
      return !term || (l.title + ' ' + (l.desc||'') + ' ' + (l.cat||'')).toLowerCase().indexOf(term) > -1;
    });
    if (!items.length) {
      box.appendChild(h('div', {class:'empty'}, state.links.length ? 'Tidak ada file yang cocok.' : 'Belum ada file. Silakan kembali lagi nanti.'));
      return;
    }
    items.forEach(function(l){
      var safe = /^https:\/\//i.test(l.url);
      var acts = h('div', {class:'acts'});
      if (safe) acts.appendChild(h('a', {class:'btn', href:l.url, target:'_blank', rel:'noopener noreferrer'}, 'File Formasi'));
      if (canEdit) {
        acts.appendChild(h('button', {class:'btn sec', onclick:function(){ editId = l.id; msg=''; render(); document.getElementById('f-title').scrollIntoView({behavior:'smooth',block:'center'}); }}, 'Edit'));
        acts.appendChild(h('button', {class:'btn del', onclick:function(){
          state.links = state.links.filter(function(x){ return x.id !== l.id; });
          save();
        }}, 'Hapus'));
      }
      var fic = h('div', {class:'fic', 'aria-hidden':'true'}); fic.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
      box.appendChild(h('div', {class:'card'}, fic,
        h('div', {class:'info'},
          h('h3', null, l.title),
          l.desc ? h('p', null, l.desc) : null,
          h('div', {class:'meta'}, [l.cat, l.date ? fmt(l.date) : ''].filter(Boolean).join(' · '))
        ), acts));
    });
  }

  function adminPanel() {
    var cur = state.links.filter(function(x){ return x.id === editId; })[0] || {};
    var fTitle = h('input', {id:'f-title', placeholder:'Contoh: Panduan Pengguna', value:cur.title || ''});
    var fUrl = h('input', {id:'f-url', type:'url', placeholder:'https://…', value:cur.url || ''});
    var fDesc = h('textarea', {rows:'2', placeholder:'Keterangan singkat (opsional)'}); fDesc.value = cur.desc || '';
    var fCat = h('input', {placeholder:'Contoh: Dokumen', list:'cats', value:cur.cat || ''});
    var dl = h('datalist', {id:'cats'});
    cats().slice(1).forEach(function(c){ dl.appendChild(h('option', {value:c})); });
    var err = h('div', {class:'note err'}, msg);

    var submit = h('button', {class:'btn', onclick:function(){
      var t = fTitle.value.trim(), u = fUrl.value.trim();
      if (!t) { err.textContent = 'Judul wajib diisi.'; return; }
      if (!/^https:\/\/\S+$/i.test(u)) { err.textContent = 'Link harus diawali https:// dan tanpa spasi.'; return; }
      var item = {id: cur.id || ('l' + Date.now().toString(36)), title:t, url:u, desc:fDesc.value.trim(), cat:fCat.value.trim(), date: cur.date || new Date().toISOString().slice(0,10)};
      if (cur.id) state.links = state.links.map(function(x){ return x.id === cur.id ? item : x; });
      else state.links.unshift(item);
      editId = null;
      save();
    }}, cur.id ? 'Simpan perubahan' : 'Tambah link');

    var sTitle = h('input', {value:state.title});
    var sDesc = h('textarea', {rows:'3'}); sDesc.value = state.description || '';

    return h('section', {class:'admin'},
      h('h2', null, cur.id ? 'Edit file' : 'Tambah link unduhan'),
      h('label', null, 'Judul file'), fTitle,
      h('label', null, 'Link unduhan (https://)'), fUrl,
      h('label', null, 'Keterangan'), fDesc,
      h('label', null, 'Kategori'), fCat, dl,
      h('div', {class:'row'}, submit, cur.id ? h('button', {class:'btn sec', onclick:function(){ editId = null; msg=''; render(); }}, 'Batal') : null),
      err,
      h('h2', {style:'margin-top:28px'}, 'Pengaturan situs'),
      h('label', null, 'Judul situs'), sTitle,
      h('label', null, 'Deskripsi situs'), sDesc,
      h('div', {class:'row'}, h('button', {class:'btn sec', onclick:function(){
        state.title = sTitle.value.trim() || 'Pusat Unduhan';
        state.description = sDesc.value.trim();
        save();
      }}, 'Simpan pengaturan')),
      h('p', {class:'note'}, 'Panel ini hanya tampil untuk Anda sebagai pemilik. Pengunjung lain hanya melihat daftar file.')
    );
  }

  render();

  (async function(){
    try {
      if (!window.claude || !claude.use) return;
      var results = await Promise.all([claude.use('artifact'), claude.use('user')]);
      artifact = results[0];
      var user = results[1];
      canEdit = !!(artifact && user && await user.canEdit());
      if (canEdit) render();
    } catch (e) { /* tetap mode baca */ }
  })();
})();
</script>

</body></html>
